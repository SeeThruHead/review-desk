name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        run: |
          apt-get update -qq && apt-get install -y -qq unzip git > /dev/null
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.12"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chrome for the component tests
        run: bunx playwright install chrome

      - name: Check every package
        run: bun run check
