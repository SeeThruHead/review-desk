name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the server with the page inside
        working-directory: packages/server
        run: bun tools/compile.ts bun-darwin-arm64 dist/review-desk
      - name: Test the menu bar tray
        working-directory: tray
        run: cargo test -- --test-threads=1
      - name: Build the menu bar tray
        working-directory: tray
        run: cargo build --release
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp packages/server/dist/review-desk tray/target/release/review-desk-tray LICENSE README.md out/
          cp docs/config.example.json out/config.example.json
          (cd out && zip -q "../review-desk-${version}-macos-arm64.zip" *)
          shasum -a 256 "review-desk-${version}-macos-arm64.zip"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "review-desk-${GITHUB_REF_NAME#v}-macos-arm64.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "macOS arm64 build of the review-desk server and the review-desk-tray menu bar app."
