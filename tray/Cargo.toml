[package]
name = "review-desk-tray"
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37.2"
tray-icon = "0.26.1"
ureq = "3.5.1"
